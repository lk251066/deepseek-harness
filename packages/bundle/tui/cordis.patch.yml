# The dsh-tui-bundle patch: the full-screen terminal surface over dsh-base.
# Applied after dsh-base's insert; rows here override base rows by id, with the
# profile's own cordis.patch.yml and any --patch overlays still to come.
#
# The TUI is single-session and composes its agent process-wide, so unlike the
# Web surface it KEEPS every base agent-plane row (tools, skills, goal, plan,
# compaction, subagents, …) rather than disabling them behind per-session
# presets. This bundle inserts only the terminal front door, its /resume index,
# shared storage, the tmux context, and the ask_user_question tool.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: agent-loop
  config:
    agents:
      - id: main
        sessionId: main
        provider: deepseek-official
        model: deepseek-v4-pro
        cwd: !!js process.cwd()

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

      Verify your work by running the code or tests. Keep answers brief and factual.

# Shared module-reload HMR stays off; the launcher's watch-only fallback still
# keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # Same temporary process-wide Code Mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

# ── TUI-only rows ───────────────────────────────────────────────────────────

- insert:
    # The derived query index behind `/resume`. The launcher provides a unique
    # process-local path because this SQLite backend has one writer owner.
    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    # The projection registry's durable checkpoint cache: `/resume` reads titles
    # from the zero-I/O checkpoint row or a tail-only cold read instead of
    # scanning whole logs.
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # Whole-log turn/step counts and wall-time totals for the TUI stats strip
    # (the `sessionStats` projection key), matching the web surface's rows.
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # Shared storage (same root the web surface uses).
    - id: storage
      name: '@deepseek-ai/dsh-storage'
    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')
    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json


    # The keyboard-backed provider behind ask_user_question and the plan-mode
    # review, and the front door it renders inside.
    - id: tui-prompt
      name: '@deepseek-ai/dsh-tui/prompt'

    # The TUI renders exactly the agent the agent-loop row bound, so it reads the
    # same launcher-owned identity rather than restating one.
    - id: tui
      name: '@deepseek-ai/dsh-tui'
      config:
        sessionId: main
        showReasoning: true
        maxToolOutputLines: 6

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
